<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuizMaster - Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style2.css?v=2">
</head>

<body>

<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">

    <div class="card shadow-lg border-0 p-4 login-card">

        <div class="text-center mb-4">
            <h1 class="fw-bold text-primary">QuizMaster</h1>
            <p class="text-muted">Online Quiz System</p>
        </div>

        <form id="loginForm">

            <div class="mb-3">
                <label class="form-label">Student Name</label>

                <input
                    type="text"
                    id="studentName"
                    class="form-control"
                    placeholder="Enter your name"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Branch</label>

                

<select id="branch" class="form-select" required>

    <option value="">Select Branch</option>

    <option value="Computer Engineering">
        Computer Engineering
    </option>

    <option value="Information Technology">
        Information Technology
    </option>

    <option value="Electronics & Communication">
        Electronics & Communication
    </option>

    <option value="Electrical Engineering">
        Electrical Engineering
    </option>

    <option value="Mechanical Engineering">
        Mechanical Engineering
    </option>

    <option value="Civil Engineering">
        Civil Engineering
    </option>

</select>
            </div>

            <div class="mb-4">
                <label class="form-label">Select Subject</label>

                <select id="subject" class="form-select" required>

                    <option value="">Choose Subject</option>

                    <option value="C Programming">
                        C Programming
                    </option>


                </select>
            </div>

            <button
                type="submit"
                class="btn btn-primary w-100 py-2">

                Start Quiz

            </button>

        </form>

        <a href="history.html"
           class="btn btn-outline-primary w-100 mt-3">

            Quiz History

        </a>

        <p class="text-center text-muted mt-4 mb-0">
    © 2026 QuizMaster | Developed by Nishant
</p>

    </div>

</div>

<script src="login.js?v=2"></script>

</body>
</html>
