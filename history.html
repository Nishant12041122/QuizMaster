<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QuizMaster - History</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="style2.css">

</head>

<body>
      
      
 

<div class="container py-4">


    <!-- Header -->

    <div class="d-flex
                justify-content-between
                align-items-center
                mb-4">

        <div>

            <h2 class="text-primary fw-bold mb-1">

                📊 Quiz History

            </h2>

            <p class="text-muted mb-0">

                Your previous quiz results

            </p>

        </div>
          


        <a
            href="index.html"
            class="btn btn-outline-primary">

            🏠 Home

        </a>

    </div>
      
    



    <!-- History Card -->

    <div class="card shadow-lg border-0">

        <div class="card-body">


            <!-- No History -->

            <div
                id="noHistory"
                class="text-center text-muted py-5"
                style="display: none;">

                <div style="font-size: 50px;">
                    📭
                </div>

                <h4>
                    No Quiz History
                </h4>

                <p>
                    Complete a quiz to see your result here.
                </p>

                <a
                    href="quiz.html"
                    class="btn btn-primary">

                    Start Quiz

                </a>

            </div>


            <!-- Table -->

            <div class="table-responsive">

                <table
                    class="table table-hover
                           table-bordered
                           align-middle
                           text-center">

                    <thead class="table-primary">

                        <tr>

                            <th>
                                #
                            </th>

                            <th>
                                Name
                            </th>

                            <th>
                                Branch
                            </th>

                            <th>
                                Subject
                            </th>

                            <th>
                                Score
                            </th>

                            <th>
                                Percentage
                            </th>

                            <th>
                                Date
                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="historyTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>


      <button
        class="btn btn-danger mt-3"
        data-bs-toggle="modal"
        data-bs-target="#passwordModal">

        🗑️ Clear Quiz History

    </button>


<!-- Password Modal -->

<div
    class="modal fade"
    id="passwordModal"
    tabindex="-1">

    <div class="modal-dialog
                modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    🔐 Delete Quiz History

                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">

                </button>

            </div>


            <div class="modal-body">

                <p class="text-muted">

                    Enter password to delete
                    all quiz history.

                </p>


                <input
                    type="password"
                    id="deletePassword"
                    class="form-control"
                    placeholder="Enter password">


                <div
                    id="passwordError"
                    class="text-danger mt-2"
                    style="display: none;">

                    ❌ Incorrect password.

                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>


                <button
                    type="button"
                    class="btn btn-danger"
                    onclick="confirmDeleteHistory()">

                    Delete History

                </button>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- History JS -->

<script src="history.js"></script>

</body>

</html>
