<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>QuizMaster - Quiz</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Your CSS -->
    <link
        rel="stylesheet"
        href="style2.css">

</head>


<body>

<div class="container py-4">

    <!-- ======================================
         HEADER
    ======================================= -->

    <div
        class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h3 class="text-primary fw-bold mb-1">
                QuizMaster
            </h3>

            <p
                id="studentInfo"
                class="text-muted mb-0">
            </p>

        </div>


        <button
            id="logoutBtn"
            type="button"
            class="btn btn-outline-danger">

            Logout

        </button>

    </div>


    <!-- ======================================
         QUIZ CARD
    ======================================= -->

    <div
        class="card shadow-lg border-0 p-4 mx-auto"
        style="max-width: 700px;">


        <!-- Quiz Header -->

        <div
            class="d-flex justify-content-between align-items-center">


            <div>

                <h4 class="text-primary fw-bold mb-1">
                    C Programming
                </h4>


                <p class="text-muted mb-0">

                    Question

                    <span id="questionNumber">
                        1
                    </span>

                    of

                    <span id="totalQuestions">
                        5
                    </span>

                </p>

            </div>


            <!-- Timer -->

            <div>

                <span
                    class="badge bg-danger fs-6">

                    ⏱️

                    <span id="timer">
                        60
                    </span>

                    s

                </span>

            </div>

        </div>


        <hr>


        <!-- ==================================
             QUESTION
        =================================== -->

        <h4
            id="question"
            class="fw-bold mb-4">
        </h4>


        <!-- ==================================
             OPTIONS
        =================================== -->

        <div id="options"></div>


        <!-- ==================================
             NEXT BUTTON
        =================================== -->

        <button
            id="nextBtn"
            type="button"
            class="btn btn-primary w-100 mt-3">

            Next Question

        </button>

    </div>

</div>
