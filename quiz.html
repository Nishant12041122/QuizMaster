<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QuizMaster - Quiz</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Your CSS -->
    <link
        rel="stylesheet"
        href="css/style2.css">

</head>


<body>


    <!-- Quiz Container -->
    <div class="container py-5">

        <div
            class="card shadow-lg border-0 p-4 mx-auto"
            style="max-width: 700px;">


            <!-- Header -->
            <div
                class="d-flex justify-content-between align-items-center">


                <div>

                    <h3 class="text-primary fw-bold mb-1">
                        QuizMaster
                    </h3>

                    <p
                        id="studentInfo"
                        class="text-muted mb-0">
                    </p>

                </div>


                <!-- Timer -->
                <div>

                    <span class="badge bg-danger fs-6">

                        ⏱️

                        <span id="timer">
                            60
                        </span>

                        s

                    </span>

                </div>


            </div>


            <hr>


            <!-- Question Number -->
            <p class="text-muted">

                Question

                <span id="questionNumber">
                    1
                </span>

                of

                <span id="totalQuestions">
                    5
                </span>

            </p>


            <!-- Question -->
            <h4
                id="question"
                class="fw-bold mb-4">
            </h4>


            <!-- Options -->
            <div id="options"></div>


            <!-- Next Button -->
            <button
                id="nextBtn"
                class="btn btn-primary w-100 mt-3">

                Next Question

            </button>


            <!-- Logout -->
            <button
                onclick="logout()"
                class="btn btn-outline-danger w-100 mt-2">

                Logout

            </button>


        </div>

    </div>


    <!-- Supabase -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>


    <!-- Quiz JavaScript -->

    <script src="quiz.js"></script>


</body>

</html>
